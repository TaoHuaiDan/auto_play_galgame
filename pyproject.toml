[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "galgame-mcp"
version = "0.1.0"
description = "A local MCP server for playing visual novels and producing Codex-friendly structured story data."
readme = { file = "README.md", content-type = "text/markdown" }
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
keywords = [
    "mcp",
    "galgame",
    "visual-novel",
    "ocr",
    "automation",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Operating System :: Microsoft :: Windows",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Games/Entertainment",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
    "mcp>=1.28.1,<2.0.0",
]

[project.optional-dependencies]
windows-ocr = [
    "winrt-Windows.Foundation>=3.2.1,<4.0.0; platform_system == 'Windows'",
    "winrt-Windows.Foundation.Collections>=3.2.1,<4.0.0; platform_system == 'Windows'",
    "winrt-Windows.Media.Ocr>=3.2.1,<4.0.0; platform_system == 'Windows'",
    "winrt-Windows.Graphics.Imaging>=3.2.1,<4.0.0; platform_system == 'Windows'",
    "winrt-Windows.Storage>=3.2.1,<4.0.0; platform_system == 'Windows'",
    "winrt-Windows.Storage.Streams>=3.2.1,<4.0.0; platform_system == 'Windows'",
    "winrt-Windows.Globalization>=3.2.1,<4.0.0; platform_system == 'Windows'",
]
# Kept as a compatibility extra for optional Pillow-based transition motion
# scoring; the server no longer uses it for automatic 2x OCR.
ocr-focus = [
    "Pillow>=10,<13",
]
rapidocr = [
    "rapidocr>=3.9,<4",
    "onnxruntime>=1.17,<2",
]
dev = [
    "build>=1.2,<2.0",
    "pytest>=8.0,<9.0",
]

[project.scripts]
galgame-mcp = "galgame_mcp.server:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-dir]
"" = "src"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
